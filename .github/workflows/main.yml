# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    strategy:
      matrix:
        smalltalk:
          - Pharo64-12
          - Pharo64-11
        smalltalk_config: [ .smalltalk.ston, .stress.smalltalk.ston ]
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.smalltalk }}, ${{ matrix.smalltalk_config }} on ${{ matrix.os }} 
    steps:
      - uses: actions/checkout@v2
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - run: smalltalkci -s ${{ matrix.smalltalk }} ${{ matrix.smalltalk_config }}
        shell: bash
        timeout-minutes: 30
      - name: Dump OSSubprocess wait diagnostics
        if: failure()
        shell: bash
        run: |
          echo "=== /tmp/ossub_wait.log (tail 300) ==="
          tail -300 /tmp/ossub_wait.log 2>/dev/null || echo "no wait log"
          echo "=== /tmp/ossub_watch.log (tail 100) ==="
          tail -100 /tmp/ossub_watch.log 2>/dev/null || echo "no watch log"
